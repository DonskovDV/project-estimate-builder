services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - db_data:/app/data
    restart: unless-stopped

volumes:
  db_data:
